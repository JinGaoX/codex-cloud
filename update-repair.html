<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>PPS影音更新修复</title>
<style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#101114;color:#f6f6f7}body{margin:0;padding:40px 24px}main{max-width:480px;margin:10vh auto}h1{font-size:25px}p{color:#b7bac3;line-height:1.8}button,a{box-sizing:border-box;display:block;width:100%;padding:15px 20px;margin:16px 0;border:0;border-radius:12px;font:inherit;text-align:center;text-decoration:none}button{background:#d3b278;color:#101114;font-weight:600}button:disabled{opacity:.6}a{background:#24262d;color:#f6f6f7}[hidden]{display:none!important}#status{min-height:60px}</style></head><body><main>
<h1>PPS影音更新修复</h1><p>目标版本 <strong id="target-version">2.20.2-personal.39</strong>。账号、片源、收藏和观看记录都会保留。</p>
<button id="check" type="button">检查并准备新版</button><button id="apply" type="button" hidden>更新并打开 PPS影音</button><p id="status" role="status" aria-live="polite">请保持联网。这个页面也可以修复旧版本一直显示“正在检查”的情况。</p><a id="home" href="./">返回 PPS影音</a>
<script>
(() => {
  const base = new URL('./', location.href), check = document.getElementById('check'), apply = document.getElementById('apply'), status = document.getElementById('status');
  document.getElementById('home').href = base.href;
  const targetVersion = "2.20.2-personal.39";
  let registration, readyWorker, ready = false;
  const timed = (promise, milliseconds) => new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('timeout')), milliseconds);
    promise.then(value => { clearTimeout(timer); resolve(value); }, error => { clearTimeout(timer); reject(error); });
  });
  const prepared = () => { ready = true; apply.hidden = false; status.textContent = '新版 ' + targetVersion + ' 已准备好。更新后请在原桌面图标中确认版本；Safari 与桌面应用可能独立保存。'; };
  const verifyVersion = worker => new Promise((resolve, reject) => {
    if (!worker) { reject(new Error('worker missing')); return; }
    const channel = new MessageChannel();
    const timer = setTimeout(() => { channel.port1.close(); reject(new Error('worker version unavailable')); }, 3000);
    channel.port1.onmessage = event => {
      clearTimeout(timer); channel.port1.close();
      if (event.data && event.data.type === 'APP_VERSION' && event.data.version === targetVersion) resolve();
      else reject(new Error('latest worker is not prepared'));
    };
    try { worker.postMessage({ type: 'GET_APP_VERSION' }, [channel.port2]); }
    catch (error) { clearTimeout(timer); channel.port1.close(); reject(error); }
  });
  const waitForInstall = installing => new Promise((resolve, reject) => {
    const started = Date.now();
    const poll = setInterval(() => {
      if (installing.state === 'installed' || installing.state === 'activated') { clearInterval(poll); resolve(); }
      else if (installing.state === 'redundant') { clearInterval(poll); reject(new Error('installation failed')); }
      else if (Date.now() - started >= 70000) { clearInterval(poll); reject(new Error('installation timed out')); }
    }, 250);
  });
  check.addEventListener('click', async () => {
    if (!('serviceWorker' in navigator) || !isSecureContext) { status.textContent = '请在 Safari 中打开这个 HTTPS 地址后重试。'; return; }
    check.disabled = true; apply.hidden = true; ready = false; status.textContent = '正在检查更新…';
    try {
      registration = await timed(navigator.serviceWorker.register(new URL('sw-standalone.js', base).href, { scope: base.pathname, updateViaCache: 'none' }), 15000);
      // An older waiting worker can coexist with this release still downloading.
      // Always ask for the newest script and verify the worker before activation.
      try { await timed(registration.update(), 15000); } catch (error) { if (!registration.installing) throw error; }
      const installing = registration.installing;
      if (installing) { status.textContent = '正在下载新版应用，请保持联网…'; await waitForInstall(installing); }
      readyWorker = installing || registration.waiting || registration.active;
      await verifyVersion(readyWorker); prepared();
    } catch { status.textContent = '更新未完成，旧版和本机资料仍保留。请检查网络后重试。'; }
    finally { check.disabled = false; }
  });
  apply.addEventListener('click', async () => {
    if (!ready) return;
    const worker = readyWorker;
    if (!worker || worker.state === 'activated') { location.assign(base.href); return; }
    apply.disabled = true; status.textContent = '正在启用新版…';
    let changed;
    const activation = new Promise(resolve => { changed = () => resolve(); navigator.serviceWorker.addEventListener('controllerchange', changed, { once: true }); });
    try { worker.postMessage({ type: 'ACTIVATE_UPDATE' }); await timed(activation, 15000); location.assign(base.href); }
    catch { status.textContent = '新版暂未启用，可以点击重试；本机资料仍保留。'; apply.disabled = false; }
    finally { navigator.serviceWorker.removeEventListener('controllerchange', changed); }
  });
})();
</script></main></body></html>
